# Airrohr Firmware CI workflow

name: Altruist Firmware Test Build
on:
  push:
    branches:
        - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        env:
          ALTRUIST_CHANNEL_TESTING: ${{ github.ref_name == 'esp32' && '0' || '1' }}
          ALTRUIST_HEALTH_TELEMETRY: '1'
          ALTRUIST_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          pio run \
            -e esp32c3_urban_en \
            -e esp32c3_urban_ru \
            -e esp32c6_urban_en \
            -e esp32c6_urban_ru \
            -e esp32c6_inside_en \
            -e esp32c6_inside_ru

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: altruist-firmware
          path: builds/latest*.bin*
