name: Deploy release binaries to Webflasher

on:
  push:
    branches:
      - esp32
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout altruist-firmware
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build release firmware (no _dev)
        env:
          ALTRUIST_CHANNEL_TESTING: '0'
          ALTRUIST_HEALTH_TELEMETRY: '1'
          ALTRUIST_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          pio run -e esp32c6_urban_en -e esp32c6_urban_ru -e esp32c6_inside_en -e esp32c6_inside_ru -e esp32c3_urban_en -e esp32c3_urban_ru

      - name: Checkout webflasher repo
        uses: actions/checkout@v4
        with:
          repository: airalab/webflasher
          token: ${{ secrets.GH_PAT }}
          path: webflasher

      - name: Update webflasher (release files only)
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd webflasher

          git config user.name "Altruist Actions"
          git config user.email "ci-automation@example.com"

          # Replace only non-dev binaries + md5, keep *_dev intact
          for f in ../builds/*.bin ../builds/*.md5; do
            case "$f" in
              *_dev.bin|*_dev.bin.md5|*_dev.md5) continue ;;
            esac
            cp "$f" firmware/Altruist/
          done

          git add firmware/Altruist
          git commit -m "Altruist release ${BRANCH} ${SHA:0:8}" || exit 0
          git push origin HEAD:main
