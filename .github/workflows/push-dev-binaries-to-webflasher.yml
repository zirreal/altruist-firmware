name: Deploy dev binaries to Webflasher

on:
  push:
    branches:
      - esp32-dev
  workflow_dispatch: {}

jobs:
  deploy-dev:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout altruist-firmware
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build dev firmware (_dev)
        run: |
          set -euo pipefail
          pio run -e esp32c6_urban_en_dev -e esp32c6_urban_ru_dev -e esp32c6_inside_en_dev -e esp32c6_inside_ru_dev

      - name: Checkout webflasher repo
        uses: actions/checkout@v4
        with:
          repository: airalab/webflasher
          token: ${{ secrets.GH_PAT }}
          path: webflasher

      - name: Update webflasher (dev files only)
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd webflasher

          git config user.name "Altruist Actions"
          git config user.email "ci-automation@example.com"

          # Replace only *_dev binaries + md5, keep release files intact
          rm -f firmware/Altruist/*_dev.bin firmware/Altruist/*_dev.bin.md5 firmware/Altruist/*_dev.md5 || true
          cp ../builds/*_dev.bin* firmware/Altruist/
          cp ../builds/*_dev.md5 firmware/Altruist/ 2>/dev/null || true

          git add firmware/Altruist
          git commit -m "Altruist dev build ${SHA:0:8}" || exit 0
          git push origin HEAD:main

