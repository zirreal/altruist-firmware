name: Altruist Firmware Debug Build

on:
  push:
    branches:
      - esp32-dev
  workflow_dispatch: {}

jobs:
  debug-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build technical debug firmware
        run: |
          set -euo pipefail
          pio run \
            -e esp32c6_urban_en_debug \
            -e esp32c6_urban_ru_debug \
            -e esp32c6_inside_en_debug \
            -e esp32c6_inside_ru_debug
