lib_deps = ${common.lib_deps_esp32_c3_platform} ${common.lib_deps_external_urban_c3}
lib_ignore = WebSockets
	ESPmDNS
build_src_filter = ${common.build_src_filter_esp32c3_urban}
extra_scripts = ${common.extra_scripts}
board_build.partitions = esp32c3_partitions.csv

