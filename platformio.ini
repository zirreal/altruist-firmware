	"-DARDUINO_USB_CDC_ON_BOOT=1"
	"-DALTRUIST_URBAN"
	"-DALTRUIST_URBAN_HW_UI"
	"-DDEBUG=4"
	; Optional one-shot: force-clear rws_devices_registered_hash on every boot
	; "-DALTRUIST_RWS_RESET_REGISTRATION=1"
lib_deps = ${common.lib_deps_esp32_platform} ${common.lib_deps_external_urban_hw}
extra_scripts = ${common.extra_scripts}
board_build.partitions = esp32c6_partitions.csv
debug_tool = esp-builtin
debug_init_break = tbreak setup

